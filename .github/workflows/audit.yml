name: Audit

# A second net behind Dependabot, which only raises security PRs when the
# repository has Dependabot alerts switched on. This needs no repo settings: it
# just runs npm audit on a schedule and fails loudly, which surfaces in Actions
# and notifies the owner.
#
# Deliberately not part of the PR gate. An advisory can land against a
# transitive dependency at any moment, and blocking every unrelated pull request
# until someone upgrades is a good way to teach people to ignore the signal.

on:
  schedule:
    # Mondays, 09:00 UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Everything, every scope, for the record. Never fails the run.
      - name: Report every advisory
        run: npm audit || true

      # Only production dependencies fail the run. This repository ships next,
      # react and react-dom; everything else is build and test tooling.
      #
      # It matches the "Dismiss low-impact alerts for development-scoped
      # dependencies" rule the repository has enabled, so the two do not
      # disagree. Without --omit=dev this would go red every time a high lands
      # against a lint or build package that Dependabot has deliberately
      # dismissed, and a check that cries wolf weekly is one people stop
      # reading. Anything dev-scoped still shows in the step above.
      - name: Fail on high or critical in production dependencies
        run: npm audit --audit-level=high --omit=dev
